
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Estudiante</title>
</head>
<body>

    <h1>Registro de Estudiante</h1>

    <form>
        <fieldset>
            <input type="hidden" value="02">
            <label for="">Codigo de Registro</label>
            <input type="text" value="09812025544" readonly>
            <br><br>

            <legend>Datos Personales</legend>

            <label for="nombre">Nombre: </label>
            <input type="text" id="nombre" placeholder="Escriba sus nombres.." name="nombre" required maxlength="20" minlength="3">

            <br><br>

            <label for="apellido">Apellido: </label>
            <input type="text" id="apellido" placeholder="Escriba sus apellidos.." name="apellido" required maxlength="20" minlength="3">

            <br><br>

            <label for="edad">Edad: </label>
            <input type="number" id="edad" placeholder="Digite su edad" name="edad" required min="1" max="100">

            <br><br>

            <label for="fechaNacimiento">Fecha de Nacimiento:</label>
            <input type="date" id="fechaNacimiento" name="fechaNacimiento">

            <label for="hora">Hora</label>
            <input type="time" id="hora" name="hora">

            <br><br>

            <button type="submit">Guardar</button>
        </fieldset>

        <fieldset>
            <legend>Datos de Contacto</legend>

            <label for="correo">Correo:</label>
            <input type="email" id="correo" placeholder="Escriba su correo" name="correo">
            <br><br>

            <label for="">Teléfono:</label>
            <input type="tel" name="telefono">
            <br><br>

            <label for="direccion">Dirección</label><br>
            <textarea name="direccion" id="direccion" rows="4" cols="40"></textarea>
            <br><br>

            <label for="ciudad">Ciudad:</label>
            <select name="ciudad" id="ciudad">
                <option value="">Seleccione una ciudad</option>
                <option value="guayaquil">Guayaquil</option>
                <option value="quito">Quito</option>
                <option value="cuenca">Cuenca</option>
                <option value="machala">Machala</option>
            </select>
        </fieldset>

        <br>

        <fieldset>
            <legend>Información Adicional</legend>
            <p>¿Qué servicios le interesan?</p>

            <input type="checkbox" id="ventas" name="servicios" value="Ventas">
            <label for="ventas">Ventas</label>

            <input type="checkbox" id="soporte" name="servicios" value="soporte">
            <label for="soporte">Soporte técnico</label>

            <input type="checkbox" id="capacitacion" name="servicios" value="capacitacion">
            <label for="capacitacion">Capacitación</label>

            <br><br>

            <label for="foto">Fotografía:</label>
            <input type="file" id="foto" name="foto" accept="image/*">
        </fieldset>

    </form>

</body>
</html>
